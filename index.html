<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顔のパーツをおぼえよう</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#fff7df;
  text-align:center;
  color:#263044;
}

.wrap{
  max-width:420px;
  margin:auto;
  padding:20px;
}

h1{
  color:#ff8c00;
  font-size:26px;
}

.face-area{
  position:relative;
  width:330px;
  margin:20px auto;
}

.face-img{
  width:100%;
  display:block;
}

.tap{
  position:absolute;
  background:rgba(255,255,255,0);
  border:none;
  cursor:pointer;
}

.eye-left{
  top:42%;
  left:23%;
  width:22%;
  height:18%;
}

.eye-right{
  top:42%;
  left:56%;
  width:22%;
  height:18%;
}

.nose{
  top:56%;
  left:42%;
  width:16%;
  height:14%;
}

.mouth{
  top:70%;
  left:35%;
  width:30%;
  height:16%;
}

.ear-left{
  top:50%;
  left:0;
  width:16%;
  height:22%;
}

.ear-right{
  top:50%;
  right:0;
  width:16%;
  height:22%;
}

.result{
  background:#fff;
  border:4px solid #8ecae6;
  border-radius:24px;
  padding:20px;
  margin-top:16px;
}

.word{
  font-size:44px;
  font-weight:bold;
  color:#fb8500;
}

.ja{
  font-size:22px;
  margin-top:8px;
}
</style>
</head>

<body>
<div class="wrap">

  <h1>😊 顔のパーツをおぼえよう！</h1>
  <p>顔のパーツをタップしてね</p>

  <div class="face-area">
    <img src="20EDAC44-180E-42AB-8C85-191BE2213E2A.png" class="face-img" alt="顔のイラスト">

    <button class="tap eye-left" onclick="showWord('eye','目')"></button>
    <button class="tap eye-right" onclick="showWord('eye','目')"></button>
    <button class="tap nose" onclick="showWord('nose','鼻')"></button>
    <button class="tap mouth" onclick="showWord('mouth','口')"></button>
    <button class="tap ear-left" onclick="showWord('ear','耳')"></button>
    <button class="tap ear-right" onclick="showWord('ear','耳')"></button>
  </div>

  <div class="result">
    <div class="word" id="word">Tap!</div>
    <div class="ja" id="ja">タップしてね</div>
  </div>

</div>

<script>
function showWord(word, japanese){
  document.getElementById("word").textContent = word;
  document.getElementById("ja").textContent = japanese;

  const speech = new SpeechSynthesisUtterance(word);
  speech.lang = "en-US";
  speech.rate = 0.75;
  speech.pitch = 1.1;

  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}
</script>

</body>
</html>
