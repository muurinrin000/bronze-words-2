<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顔のパーツをおぼえよう</title>

<style>
body{
  margin:0;
  font-family:"Arial", sans-serif;
  background:#fff7df;
  color:#263044;
  text-align:center;
}

.wrap{
  max-width:420px;
  margin:auto;
  padding:20px;
}

h1{
  font-size:26px;
  color:#ff8c00;
}

.face{
  position:relative;
  width:300px;
  height:360px;
  margin:20px auto;
  background:#ffd9b3;
  border-radius:48% 48% 45% 45%;
  border:6px solid #ffb703;
}

.part{
  position:absolute;
  border:none;
  cursor:pointer;
  font-weight:bold;
  font-size:16px;
  border-radius:30px;
  background:#fff;
  box-shadow:0 5px 0 #d8c8a0;
  padding:10px 16px;
}

.part:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #d8c8a0;
}

.eye-left{ top:95px; left:55px; }
.eye-right{ top:95px; right:55px; }
.ear-left{ top:135px; left:-35px; }
.ear-right{ top:135px; right:-35px; }
.nose{ top:165px; left:115px; }
.mouth{ top:245px; left:105px; }
.hair{ top:20px; left:105px; }
.face-btn{ bottom:20px; left:105px; }

.result{
  background:#fff;
  border-radius:24px;
  padding:20px;
  margin-top:20px;
  border:4px solid #8ecae6;
}

.word{
  font-size:42px;
  color:#fb8500;
  font-weight:bold;
}

.ja{
  font-size:22px;
  margin-top:8px;
}

.hint{
  margin-top:10px;
  font-size:15px;
  color:#607089;
}
</style>
</head>

<body>
<div class="wrap">
  <h1>😊 顔のパーツをおぼえよう！</h1>
  <p>顔のパーツをタップしてね</p>

  <div class="face">
    <button class="part hair" onclick="showWord('hair','髪の毛')">hair</button>
    <button class="part eye-left" onclick="showWord('eye','目')">eye</button>
    <button class="part eye-right" onclick="showWord('eye','目')">eye</button>
    <button class="part ear-left" onclick="showWord('ear','耳')">ear</button>
    <button class="part ear-right" onclick="showWord('ear','耳')">ear</button>
    <button class="part nose" onclick="showWord('nose','鼻')">nose</button>
    <button class="part mouth" onclick="showWord('mouth','口')">mouth</button>
    <button class="part face-btn" onclick="showWord('face','顔')">face</button>
  </div>

  <div class="result">
    <div class="word" id="word">Tap!</div>
    <div class="ja" id="ja">タップしてね</div>
    <div class="hint">英単語が出て、発音が流れます</div>
  </div>
</div>

<script>
function showWord(word, japanese){
  document.getElementById("word").textContent = word;
  document.getElementById("ja").textContent = japanese;

  const speech = new SpeechSynthesisUtterance(word);
  speech.lang = "en-US";
  speech.rate = 0.75;
  speech.pitch = 1.1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}
</script>
</body>
</html>
